<title>CGBFL Play Trainer — Center Grove Bantam Football League</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* CGBFL: near-black board + red accent */
    --board:#141414;
    --board-dark:#050505;
    --chalk:#f7f6ef;
    --chalk-dim:rgba(247,246,239,.62);
    --yellow:#E2192C;
    --red:#ff5c52;
    --blue:#b7b7b7;
    --fakeball:#8a8a8a;
    --wood:var(--yellow);
    --line:rgba(247,246,239,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%}
  body{
    background:var(--board-dark);
    color:var(--chalk);
    font-family:'Rubik',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }
  button{touch-action:manipulation;min-height:48px;font-family:'Rubik',sans-serif}
  .frame{max-width:880px;margin:0 auto;padding:18px 14px 60px}
  header{text-align:center;padding:20px 0 8px}
  header h1{font-weight:800;font-size:clamp(24px,6vw,40px);letter-spacing:.5px;text-transform:uppercase}
  header h1 span{color:var(--yellow)}
  header p{font-size:16px;color:var(--chalk-dim);margin-top:4px;font-weight:500}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 16px;min-height:52px}
  .backbtn{
    font-weight:700;letter-spacing:.4px;font-size:14px;text-transform:uppercase;
    background:none;border:2px solid var(--line);color:var(--chalk-dim);
    padding:10px 16px;border-radius:12px;cursor:pointer;
  }
  .backbtn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .screentitle{font-weight:800;font-size:16px;letter-spacing:1px;text-transform:uppercase;color:var(--yellow)}
  .scorebar{
    display:flex;justify-content:flex-end;gap:20px;flex:1;
    font-weight:700;font-size:12px;letter-spacing:1px;
    color:var(--chalk-dim);text-transform:uppercase;
  }
  .scorebar b{color:var(--yellow);font-size:17px;margin-left:5px}
  .card{
    background:var(--board);border:4px solid var(--wood);border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 0 2px rgba(0,0,0,.25);padding:20px;
  }
  /* HOME */
  .home{display:grid;gap:12px;grid-template-columns:1fr 1fr}
  .home .poswrap{grid-column:1 / -1}
  @media(max-width:520px){.home{grid-template-columns:1fr}}
  .bigbtn{
    display:block;width:100%;text-align:left;
    background:rgba(0,0,0,.18);border:2px solid var(--line);color:var(--chalk);
    border-radius:14px;padding:20px;cursor:pointer;
  }
  .bigbtn:active{transform:scale(.985)}
  .bigbtn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .bigbtn{padding:16px}
  .bigbtn h2{font-weight:800;font-size:18px;letter-spacing:.5px;text-transform:uppercase}
  .bigbtn h2 span{margin-right:8px}
  .bigbtn p{color:var(--chalk-dim);font-size:13.5px;margin-top:4px;line-height:1.4}
  .poswrap{margin-top:6px}
  .poswrap h3{font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--chalk-dim);margin-bottom:8px;text-align:center}
  .poschips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{
    font-weight:700;font-size:13px;letter-spacing:.3px;
    background:none;border:2px solid var(--line);color:var(--chalk-dim);
    padding:10px 14px;min-height:44px;border-radius:999px;cursor:pointer;
  }
  .chip.active{border-color:var(--yellow);color:var(--yellow)}
  .chip:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  /* SHARED */
  .prompt{font-size:18px;text-align:center;margin-bottom:10px;font-weight:500}
  .tapnote{text-align:center;font-size:14px;color:var(--yellow);margin-top:4px;font-weight:700;letter-spacing:.3px}
  svg{display:block;width:100%;height:auto}
  .diagram{cursor:pointer;border-radius:8px}
  .diagram:active{background:rgba(255,255,255,.04)}
  .paths{opacity:0;transition:opacity .5s}
  svg.snapped .paths{opacity:1}
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  @media(max-width:520px){.answers{grid-template-columns:1fr}}
  .ans{
    font-weight:700;letter-spacing:.4px;font-size:16px;
    background:rgba(0,0,0,.18);border:2px solid var(--line);color:var(--chalk);
    padding:16px 12px;min-height:60px;border-radius:12px;cursor:pointer;
    transition:transform .08s;line-height:1.3;
  }
  @media(hover:hover){.ans:hover{transform:translateY(-2px);border-color:var(--chalk-dim)}}
  .ans:active{transform:scale(.97)}
  .ans:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .ans.correct{border-color:var(--chalk);color:var(--chalk)}
  .ans.wrong{border-color:var(--red);color:var(--red)}
  .ans:disabled{cursor:default;opacity:.92}
  .feedback{min-height:56px;margin-top:14px;text-align:center;font-size:18px;font-weight:500}
  .feedback .tip{color:var(--chalk-dim);font-size:16px;display:block;margin-top:4px;font-weight:400;line-height:1.45}
  .nextbtn{
    display:block;margin:12px auto 0;
    font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    background:var(--yellow);color:#0d0d0d;border:none;
    padding:16px 34px;min-height:56px;border-radius:12px;font-size:16px;cursor:pointer;
  }
  .nextbtn:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
  /* STUDY */
  .bookgrid{display:grid;gap:16px}
  .bookitem{background:var(--board);border:3px solid var(--wood);border-radius:12px;padding:14px}
  .bookitem h3{font-weight:800;letter-spacing:.5px;color:var(--yellow);font-size:17px;margin-bottom:2px}
  .bookitem .dest{font-weight:700;font-size:12px;letter-spacing:1px;color:var(--chalk-dim);text-transform:uppercase}
  .hint{
    margin-top:10px;padding:10px 12px;border-radius:10px;
    background:rgba(0,0,0,.18);font-size:15px;line-height:1.45;
  }
  .hint b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
  .hint.pre b{color:var(--blue)}
  .hint.post b{color:var(--yellow)}
  .hint.pos b{color:var(--red)}
  .legend{text-align:center;font-size:14px;color:var(--chalk-dim);margin-top:18px;line-height:1.5}
  .legend b{color:var(--chalk)}
  /* collapsible study list */
  .bookhead{width:100%;background:none;border:none;color:var(--chalk);display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:4px 2px;cursor:pointer;min-height:52px;font-family:'Rubik',sans-serif}
  .bookhead h3{font-size:17px}
  .caret{font-size:20px;color:var(--yellow);transition:transform .2s;flex:none}
  .bookitem:not(.collapsed) .caret{transform:rotate(90deg)}
  .bookitem.collapsed .bookbody{display:none}
  /* section / subcategory grouping in Study */
  .secgroup{margin-bottom:14px}
  .sechead{width:100%;background:rgba(226,25,44,.12);border:3px solid var(--wood);border-radius:12px;color:var(--chalk);display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:12px 14px;cursor:pointer;min-height:52px;font-family:'Rubik',sans-serif;font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:15px}
  .secgroup:not(.collapsed) .caret{transform:rotate(90deg)}
  .secgroup.collapsed .secbody{display:none}
  .secbody{padding:12px 0 0 4px}
  .subgroup{margin-bottom:10px}
  .subhead{width:100%;background:rgba(0,0,0,.2);border:2px solid var(--line);border-radius:10px;color:var(--chalk-dim);display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 12px;cursor:pointer;min-height:46px;font-family:'Rubik',sans-serif;font-weight:700;font-size:14px;letter-spacing:.3px;text-transform:uppercase}
  .subgroup:not(.collapsed) .caret{transform:rotate(90deg)}
  .subgroup.collapsed .subbody{display:none}
  .subbody{padding-top:8px}
  /* play search */
  .searchbox{width:100%;background:rgba(0,0,0,.18);border:2px solid var(--line);color:var(--chalk);border-radius:12px;padding:14px;font-size:15px;font-family:'Rubik',sans-serif;min-height:48px}
  .searchbox::placeholder{color:var(--chalk-dim)}
  .searchbox:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  /* stage pill on boards */
  .diagram{position:relative}
  .stagepill{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:var(--yellow);font-weight:800;font-size:12px;letter-spacing:1px;padding:5px 10px;border-radius:999px;pointer-events:none}
  /* louder answer feedback */
  .fx-good{animation:fxgood .55s ease}
  @keyframes fxgood{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.45)}35%{box-shadow:0 0 0 8px rgba(247,246,239,.75),0 10px 30px rgba(0,0,0,.45)}}
  .fx-bad{animation:fxbad .45s ease}
  @keyframes fxbad{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-140%);background:var(--yellow);color:#0d0d0d;font-weight:800;padding:12px 20px;border-radius:12px;z-index:50;transition:transform .35s;box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:15px;text-align:center;max-width:90vw}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .cfetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}

let AC=null;
function snd(kind){
  if(!stats.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const t=AC.currentTime;
    const tone=(f0,f1,dur,type,vol,at)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type;
      o.frequency.setValueAtTime(f0,t+at);
      o.frequency.linearRampToValueAtTime(f1,t+at+dur);
      g.gain.setValueAtTime(vol,t+at);
      g.gain.exponentialRampToValueAtTime(.001,t+at+dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t+at); o.stop(t+at+dur+.02);
    };
    if(kind==="whistle"){ tone(2100,2600,.28,"sine",.10,0); }
    else if(kind==="good"){ tone(660,660,.12,"triangle",.16,0); tone(880,880,.16,"triangle",.16,.12); }
    else if(kind==="bad"){ tone(200,160,.22,"square",.10,0); }
    else if(kind==="quack"){ tone(420,240,.14,"sawtooth",.18,0); tone(420,240,.14,"sawtooth",.18,.16); }
    else if(kind==="tick"){ tone(1100,1100,.05,"square",.09,0); }
  }catch(e){}
}

const DEF = [
  ["E",282.5,461.6],
  ["N",343.8,461.6],

function busySpots(play){
  const spots=[];
  const d=play.dia;
  const firstXY = str => { const m=str.match(/M?\s*([\d.]+)[, ]([\d.]+)/); return m?[+m[1],+m[2]]:null; };
  (d.routes||[]).forEach(r=>{ const m=firstXY(r); if(m) spots.push(m); });
  (d.fakes||[]).forEach(f=>{ const m=firstXY(f); if(m) spots.push(m); });
  if(d.motion){ const m=firstXY(d.motion); if(m) spots.push(m); }
  if(d.preMotion){ const m=firstXY(d.preMotion); if(m) spots.push(m); }
  const b=firstXY(d.ball); if(b) spots.push(b);
  return spots;
}
function makeBlocks(play){
  const P = offensePlayers(play.form);
  const B = [];
  const claimed = new Set(["E1","N","T","E2","M"]);
  B.push([300,536,...LB.E1],[335,536,...LB.N],[405,536,...LB.T],[440,536,...LB.E2],[370,536,...LB.M]);
  const busy = busySpots(play);
  const isBusy = (x,y)=> busy.some(([bx,by])=> Math.hypot(bx-x,by-y)<40);
  const candidates = [...P.ends, ...P.backs.filter(b=>b[2]!=="QB")]
    .filter(([x,y,lab])=> lab!==play.carrier && !isBusy(x,y));
  let pool;
  if(play.dest==="run-left")       pool=["W","CL","S","FS","SS","CR"];
  else if(play.dest==="run-right") pool=["S","CR","W","SS","FS","CL"];
  else if(play.dest==="run-middle")pool=["W","S","FS","SS","CL","CR"];
  else                             pool=["W","S"];
  candidates.sort((a,b)=> (a[2]==="FB"||a[2]==="RB"?-1:0)-(b[2]==="FB"||b[2]==="RB"?-1:0));
  candidates.forEach(([x,y,lab])=>{
    // A play can pin a specific player to a specific defender (e.g. a receiver
    // stays in to block a corner on a screen) instead of the generic nearest-pick.
    const forced = play.blockKeys && play.blockKeys[lab];
    if(forced){ claimed.add(forced); B.push([x,y,...LB[forced]]); return; }
    let bestKey=null, bestD=Infinity;
    pool.forEach(k=>{
      if(claimed.has(k)) return;
      const d=Math.hypot(LB[k][0]-x, LB[k][1]-y);
      if(d<bestD){bestD=d;bestKey=k;}
    });
    if(!bestKey && play.dest==="pass"){
      bestKey = Math.hypot(LB.E1[0]-x,LB.E1[1]-y) < Math.hypot(LB.E2[0]-x,LB.E2[1]-y) ? "E1" : "E2";
      B.push([x,y,LB[bestKey][0]+(bestKey==="E1"?-14:14),LB[bestKey][1]+14]);
      return;
    }
    if(bestKey){ claimed.add(bestKey); B.push([x,y,...LB[bestKey]]); }
  });
  return B;
}

function playerG(x,y,lab,qb=false,flip=false){
  const shape = lab==="C-OL"
    ? `<rect x="-10" y="-10" width="20" height="20" fill="var(--board)" stroke="var(--chalk)" stroke-width="3"/>`
    : qb
      ? `<circle r="12.5" fill="var(--chalk)"/>`
      : `<circle r="12.5" fill="var(--board)" stroke="var(--chalk)" stroke-width="3"/>`;
  const text = (lab && lab!=="C-OL" && !["LT","LG","RG","RT","SE","WR"].includes(lab))
    ? `<text y="${flip?-19:27}" class="plab">${lab}</text>` : "";
  return `<g class="pl" data-x="${x}" data-y="${y}" transform="translate(${x},${y})">${shape}${text}</g>`;
}
// Mirror every coordinate pair in an absolute SVG path (M/L/C) around the
// field's true center (x=380, y=450 in this 760x900 coordinate space) — a
// full 180° rotation, not just a vertical flip. Viewing "from the defense's
// side" means standing on the opposite side of the ball facing the other
// way, so BOTH near/far (y) and left/right (x) invert together; mirroring
// only y would leave every formation's strong side on the wrong hand for a
// defender actually reading the diagram from that vantage point.
function mirrorPath(d){
  return d.replace(/(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)/g, (m,x,y)=> `${760-(+x)},${900-(+y)}`);
}
function playSVG(play, flip=false){
  const Y = y => flip ? 900-y : y;
  const Xm = x => flip ? 760-x : x;
  const MP = d => flip ? mirrorPath(d) : d;
  const P = offensePlayers(play.form);
  let players="";
  P.OL.forEach(([x,y,lab])=> players += playerG(Xm(x),Y(y),lab==="C"?"C-OL":lab,false,flip));
  P.ends.forEach(([x,y,lab])=> players += playerG(Xm(x),Y(y),lab,false,flip));
  P.backs.forEach(([x,y,lab])=> players += playerG(Xm(x),Y(y),lab,lab==="QB",flip));
  let def="";
  DEF.forEach(([lab,x,y])=>{
    const role = ["E","N","T"].includes(lab) ? "dl" : ["W","M","S"].includes(lab) ? "lb" : "db";
    const labelY = y + (role==="dl" ? 5 : role==="lb" ? -5 : 0);
    const xx = Xm(x);
    const yy = Y(labelY)+(flip?12:0);
    def += `<text x="${xx}" y="${yy}" data-ox="${xx}" data-oy="${yy}" data-d="${role}" class="dlab">${lab}</text>`;
  });
  const d=play.dia;
  let paths="";
  (play.dia.customBlocks || makeBlocks(play)).forEach(([x1,y1,x2,y2])=>{
    paths += `<path data-kind="block" d="${MP(`M${x1},${y1-8} L${x2},${y2+10}`)}" fill="none" stroke="var(--blue)" stroke-width="2" opacity=".75" marker-end="url(#blk)"/>`;
  });
  (d.fakes||[]).forEach(p=> paths+=`<path data-kind="fake" d="${MP(p)}" fill="none" stroke="var(--chalk-dim)" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#ah-dim)"/>`);
  (d.routes||[]).forEach(r=> paths+=`<path data-kind="route" d="${MP(r)}" fill="none" stroke="var(--chalk-dim)" stroke-width="2" marker-end="url(#ah-dim)"/>`);
  if(d.motion) paths+=`<path data-kind="motion" d="${MP(d.motion)}" fill="none" stroke="var(--yellow)" stroke-width="2" stroke-dasharray="3 6"/>`;
  if(d.preMotion) paths+=`<path data-kind="premotion" d="${MP(d.preMotion)}" fill="none" stroke="var(--yellow)" stroke-width="2" stroke-dasharray="3 6"/>`;

  }

  const yards = [[80,"50"],[167,"45"],[254,"40"],[341,"35"],[428,"30"],[515,"25"]];

    hashes += `<line x1="20" y1="${Y(ly)}" x2="740" y2="${Y(ly)}" stroke="var(--line)" stroke-width="1"/>`;

  const youNote = flip ? `<text x="375" y="740" class="youlab">⬆ YOUR SIDE — offense is coming at you</text>` : "";

    ${defsBlock()}
    <line x1="20" y1="${Y(536)}" x2="740" y2="${Y(536)}" stroke="var(--chalk)" stroke-width="2"/>
    <line x1="20" y1="${Y(145)}" x2="740" y2="${Y(145)}" stroke="var(--line)" stroke-width="1"/>

function defViewSVG(form){
  const P = offensePlayers(form);

  // ball and looking at the offense sees it mirrored left-right, not just
  // compressed vertically — without this, the diagram silently shows the
  // formation's un-mirrored (offense's-eye) layout while the quiz asks the
  // player to name it as seen "across from" them on defense.
  const Xm = x => 760-x;

  P.OL.forEach(([x,y,lab])=>{
    players += lab==="C"
      ? `<rect x="${Xm(x)-10}" y="${F(y)-10}" width="20" height="20" fill="none" stroke="var(--chalk)" stroke-width="3"/>`
      : `<circle cx="${Xm(x)}" cy="${F(y)}" r="12.5" fill="none" stroke="var(--chalk)" stroke-width="3"/>`;
  });
  P.ends.forEach(([x,y])=> players+=`<circle cx="${Xm(x)}" cy="${F(y)}" r="12.5" fill="none" stroke="var(--chalk)" stroke-width="3"/>`);
  P.backs.forEach(([x,y,lab])=>{
    players += lab==="QB"
      ? `<circle cx="${Xm(x)}" cy="${F(y)}" r="12.5" fill="var(--chalk)"/>`
      : `<circle cx="${Xm(x)}" cy="${F(y)}" r="12.5" fill="none" stroke="var(--chalk)" stroke-width="3"/>`;
  });
  let you="";
  [230,300,370,440,510].forEach(x=> you+=`<text x="${x}" y="238" class="xlab">✕</text>`);
  you += `<text x="370" y="272" class="youlab">⬆ YOU'RE STANDING HERE</text>`;
  return `<svg viewBox="0 0 760 290" role="img" aria-label="Formation seen from the defense">
    ${defsBlock()}
    <line x1="20" y1="190" x2="740" y2="190" stroke="var(--chalk)" stroke-width="2"/>

  </svg>`;
}
function defsBlock(){
  return `<defs>
    <marker id="ah-dim" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--chalk-dim)"/></marker>
    <marker id="blk" markerWidth="10" markerHeight="10" refX="4" refY="4" orient="auto"><line x1="4" y1="0" x2="4" y2="8" stroke="var(--blue)" stroke-width="2"/></marker>
    <style>
      .dlab{font-family:'Rubik';font-weight:800;font-size:18px;fill:var(--chalk-dim);text-anchor:middle}
      .plab{font-family:'Rubik';font-weight:600;font-size:13px;fill:var(--chalk-dim);text-anchor:middle}
      .xlab{font-family:'Rubik';font-weight:700;font-size:20px;fill:var(--red);text-anchor:middle}
      .ydnum{font-family:'Rubik';font-weight:700;font-size:13px;fill:var(--line);text-anchor:middle;letter-spacing:1px}
      .youlab{font-family:'Rubik';font-weight:700;font-size:15px;fill:var(--red);text-anchor:middle;letter-spacing:1px}

// =============== SIMULATION (staged: pre-snap → slow-mo → full speed) ===============
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const ease = t => t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const pathStart = p => p.getPointAtLength(0);
function nearestPlayer(svg, x, y, max=45){
  let best=null, bd=max;
  svg.querySelectorAll("g.pl").forEach(g=>{
    const d=Math.hypot(+g.dataset.x-x, +g.dataset.y-y);
    if(d<bd){bd=d;best=g;}
  });
  return best;
}
function resetBoard(svg){
  svg.querySelectorAll("g.pl").forEach(g=> g.setAttribute("transform",`translate(${g.dataset.x},${g.dataset.y})`));
  svg.querySelectorAll(".dlab[data-ox]").forEach(t=>{ t.setAttribute("x",t.dataset.ox); t.setAttribute("y",t.dataset.oy); });
  svg.querySelectorAll('[data-kind="block"]').forEach(p=>{ if(p.dataset.d0) p.setAttribute("d",p.dataset.d0); });
  svg.classList.remove("snapped");
  const dot = svg.querySelector(".balldot");
  if(dot){ dot.setAttribute("opacity","0"); dot.style.fill = ""; }
  svg.querySelectorAll('[data-kind="ball"],[data-kind="throw"]').forEach(p=>{
    const l=p.getTotalLength(); p.style.strokeDasharray=l; p.style.strokeDashoffset=l;
  });
}
async function simulate(svg, speed=1, opts={}){
  if(!svg) return;
  if(!svg._runIdRef) svg._runIdRef = {id:0};
  const myRun = ++svg._runIdRef.id;
  const runRef = svg._runIdRef;
  const move = (el, pathEl, dur, delay, opts={})=>{
    const len = pathEl.getTotalLength();
    if(opts.trace){ pathEl.style.strokeDasharray = len; pathEl.style.strokeDashoffset = len; }
    return new Promise(res=>{
      const start = performance.now() + delay;
      function frame(now){
        if(runRef.id!==myRun){ res(); return; }
        let t = (now-start)/dur;
        if(t<0){ requestAnimationFrame(frame); return; }
        if(t>1) t=1;
        const p = pathEl.getPointAtLength(ease(t)*len);
        if(el.classList && el.classList.contains("balldot")){
          el.setAttribute("cx",p.x); el.setAttribute("cy",p.y);
        } else if(el){
          el.setAttribute("transform",`translate(${p.x},${p.y})`);
        }
        if(opts.trace) pathEl.style.strokeDashoffset = len*(1-ease(t));
        if(t<1) requestAnimationFrame(frame); else res();
      }
      requestAnimationFrame(frame);
    });
  };
  // Straight-line mover for the ball dot (used for the snap and the handoff)
  const lerpMove=(el,x1,y1,x2,y2,dur,delay=0)=>new Promise(res=>{
    if(dur<=0){ el.setAttribute("cx",x2); el.setAttribute("cy",y2); res(); return; }
    const start=performance.now()+delay;
    function fr(now){
      if(runRef.id!==myRun){ res(); return; }
      let t=(now-start)/dur;
      if(t<0){ requestAnimationFrame(fr); return; }
      if(t>1) t=1;
      const e=ease(t);
      el.setAttribute("cx",x1+(x2-x1)*e);
      el.setAttribute("cy",y1+(y2-y1)*e);
      if(t<1) requestAnimationFrame(fr); else res();
    }
    requestAnimationFrame(fr);
  });
  // Lofted mover: ball arcs through the air (tosses & passes), optionally
  // drawing its flight line as it goes
  const arcMove=(el,x1,y1,x2,y2,dur,delay,h,tracePath)=>new Promise(res=>{
    let len=0;
    if(tracePath){ len=tracePath.getTotalLength(); tracePath.style.strokeDasharray=len; tracePath.style.strokeDashoffset=len; }
    const start=performance.now()+delay;
    function fr(now){
      if(runRef.id!==myRun){ res(); return; }
      let t=(now-start)/dur;
      if(t<0){ requestAnimationFrame(fr); return; }
      if(t>1) t=1;
      const e=ease(t);
      el.setAttribute("cx",x1+(x2-x1)*e);
      el.setAttribute("cy",y1+(y2-y1)*e - h*4*e*(1-e));
      if(tracePath) tracePath.style.strokeDashoffset=len*(1-e);
      if(t<1) requestAnimationFrame(fr); else res();
    }
    requestAnimationFrame(fr);
  });
  // Position of a player group right now (mid-animation)
  const getPos = g=>{
    const m=/translate\(([-\d.]+)[, ]([-\d.]+)\)/.exec(g.getAttribute("transform")||"");
    return m ? {x:+m[1], y:+m[2]} : {x:+g.dataset.x, y:+g.dataset.y};
  };
  // Ball chases a MOVING player (the mesh happens on the run)
  const chase=(el,targetG,dur,delay=0)=>new Promise(res=>{
    const start=performance.now()+delay; let sx=null,sy=null;
    function fr(now){
      if(runRef.id!==myRun){ res(); return; }
      let t=(now-start)/dur;
      if(t<0){ requestAnimationFrame(fr); return; }
      if(sx===null){ sx=+el.getAttribute("cx"); sy=+el.getAttribute("cy"); }
      if(t>1) t=1;
      const p=getPos(targetG), e=ease(t);
      el.setAttribute("cx",sx+(p.x-sx)*e);
      el.setAttribute("cy",sy+(p.y-sy)*e);
      if(t<1) requestAnimationFrame(fr); else res();
    }
    requestAnimationFrame(fr);
  });
  // Ball rides with the runner until his run is over
  const attach=(el,targetG,isDone)=>new Promise(res=>{
    function fr(){
      if(runRef.id!==myRun){ res(); return; }
      const p=getPos(targetG);
      el.setAttribute("cx",p.x); el.setAttribute("cy",p.y-3);
      if(isDone()) res(); else requestAnimationFrame(fr);
    }
    requestAnimationFrame(fr);
  });
  // Move a player group to a point (QB opening to the mesh)
  const gmove=(g,x2,y2,dur,delay=0)=>new Promise(res=>{
    const start=performance.now()+delay; let sx=null,sy=null;
    function fr(now){
      if(runRef.id!==myRun){ res(); return; }
      let t=(now-start)/dur;
      if(t<0){ requestAnimationFrame(fr); return; }
      if(sx===null){ const p=getPos(g); sx=p.x; sy=p.y; }
      if(t>1) t=1;
      const e=ease(t);
      g.setAttribute("transform",`translate(${sx+(x2-sx)*e},${sy+(y2-sy)*e})`);
      if(t<1) requestAnimationFrame(fr); else res();
    }
    requestAnimationFrame(fr);
  });
  // Move a defender label toward the ball
  const dmove=(tx,x2,y2,dur,delay=0)=>new Promise(res=>{
    const start=performance.now()+delay;
    const x1=+tx.getAttribute("x"), y1=+tx.getAttribute("y");
    function fr(now){
      if(runRef.id!==myRun){ res(); return; }
      let t=(now-start)/dur;
      if(t<0){ requestAnimationFrame(fr); return; }
      if(t>1) t=1;
      const e=ease(t);
      tx.setAttribute("x",x1+(x2-x1)*e);
      tx.setAttribute("y",y1+(y2-y1)*e);
      if(t<1) requestAnimationFrame(fr); else res();
    }
    requestAnimationFrame(fr);
  });
  // Timing. At full speed each action takes its natural time (blocks hit fast,
  // routes develop slower). In slow motion the WHOLE play stretches together —
  // blockers, fakes, and routes keep moving until the ball carrier finishes,
  // so every position can be watched in slow-mo, not just the ball.
  const slow = speed > 1.5;
  const ballDur = 1700*speed;
  const D = {
    motion: 650*speed,
    block: slow ? ballDur*0.85 : 750,
    fake:  slow ? ballDur*0.90 : 900,
    route: slow ? ballDur*0.95 : 1500,
    ball:  ballDur,
    throw: 480*speed,
    snapDelay: 120*speed,
    ballDelay: 260*speed,
  };
  resetBoard(svg);
  svg.classList.add("snapped");            // fade the play lines in
  // Freeze-frame: after opts.freezeAfter ms, stop all movement and leave
  // every player exactly where he is (a mid-play snapshot).
  let freezeTimer=null;
  if(opts.freezeAfter){
    freezeTimer = setTimeout(()=>{ if(runRef.id===myRun) runRef.id++; }, opts.freezeAfter);
  }
  const ballLine = svg.querySelector('[data-kind="ball"]');
  const throwLine = svg.querySelector('[data-kind="throw"]');
  const motionLine = svg.querySelector('[data-kind="motion"]');
  const dot = svg.querySelector(".balldot");
  if(REDUCED){
    svg.querySelectorAll('[data-kind="ball"],[data-kind="throw"]').forEach(p=> p.style.strokeDashoffset=0);
    return;
  }
  snd("whistle");
  let motionMan = null;
  if(motionLine){
    const s = pathStart(motionLine);
    motionMan = nearestPlayer(svg, s.x, s.y);
    if(motionMan) await move(motionMan, motionLine, D.motion, 150);
    if(runRef.id!==myRun) return;
  }
  // Pre-snap misdirection motion (Roger/Lucy reverses): the WB really goes in motion
  // before the snap, but he is NOT the ball carrier here (the FB is) — animate him
  // separately so he doesn't get mistaken for the carrier the way jet motion does.
  const preMotionLine = svg.querySelector('[data-kind="premotion"]');
  if(preMotionLine){
    const s = pathStart(preMotionLine);
    const preMotionMan = nearestPlayer(svg, s.x, s.y);
    if(preMotionMan) await move(preMotionMan, preMotionLine, D.motion, 150);
    if(runRef.id!==myRun) return;
  }
  const jobs = [];
  // Blockers pursue their LIVE defender; the blue line re-aims every frame
  svg.querySelectorAll('[data-kind="block"]').forEach(b=>{
    if(!b.dataset.d0) b.dataset.d0 = b.getAttribute("d");
    const s = pathStart(b);
    const g = nearestPlayer(svg, s.x, s.y+8);
    if(!g) return;
    const end0 = b.getPointAtLength(b.getTotalLength());
    let tgt=null, bd=30;
    svg.querySelectorAll(".dlab[data-d]").forEach(t=>{
      const d=Math.hypot(+t.getAttribute("x")-end0.x, +t.getAttribute("y")-end0.y);
      if(d<bd){ bd=d; tgt=t; }
    });
    jobs.push(new Promise(res=>{
      const start = performance.now() + D.snapDelay;
      let gx=null, gy=null;
      function fr(now){
        if(runRef.id!==myRun){ res(); return; }
        let t=(now-start)/D.block;
        if(t<0){ requestAnimationFrame(fr); return; }
        if(gx===null){ const p=getPos(g); gx=p.x; gy=p.y; }
        const tx = tgt ? +tgt.getAttribute("x") : end0.x;
        const ty = tgt ? +tgt.getAttribute("y") : end0.y;
        const ey = ty + (gy>ty ? 12 : -12);                    // engage just short of him
        const e = ease(Math.min(1,t));
        g.setAttribute("transform",`translate(${gx+(tx-gx)*e},${gy+(ey-gy)*e})`);
        b.setAttribute("d",`M${s.x},${s.y} L${tx},${ey}`);     // line follows the man
        if(now-start < D.ball) requestAnimationFrame(fr);       // stay latched through the play
        else res();
        if(t>=1 && !fr.done){ fr.done=true; res(); }            // resolve once engaged, keep riding
      }
      requestAnimationFrame(fr);
    }));

    const s=pathStart(f);
    const g=nearestPlayer(svg,s.x,s.y);
    if(g) jobs.push(move(g,f,D.fake,D.snapDelay));
  });
  svg.querySelectorAll('[data-kind="route"]').forEach(r=>{
    const s=pathStart(r);
    const g=nearestPlayer(svg,s.x,s.y);
    if(g) jobs.push(move(g,r,D.route,D.snapDelay));
  });
  let carrierDone=false;
  if(ballLine && dot){
    const sPt = pathStart(ballLine);
    const pls = [...svg.querySelectorAll("g.pl")];
    const cg = pls.find(g=>g.querySelector("rect"));                       // the Center
    const qg = pls.find(g=>{const t=g.querySelector("text"); return t && t.textContent==="QB";});
    const cx=+cg.dataset.x, cy=+cg.dataset.y, qx=+qg.dataset.x, qy=+qg.dataset.y;
    // A thrown pass: the play's actual ball carrier (from the data, not guessed by
    // position) is a receiver, not the QB — yet the ball path starts right at the
    // QB's own spot because that's where he releases it from. Nobody's icon should
    // ride that path; only the ball itself travels through the air. Without this
    // check, nearestPlayer() below finds the QB (he's standing exactly on the
    // path's start point) and wrongly drags his icon all the way to the receiver.
    const carrierLabel = svg.dataset.carrier || "";
    const namedCarrierG = carrierLabel ? pls.find(g=>{const t=g.querySelector("text"); return t && t.textContent===carrierLabel;}) : null;
    // Jet-motion sweeps: the named carrier (the WB) is the SAME man who just ran the
    // pre-snap "motion" path, so he's no longer standing at his original alignment
    // spot when the ball reaches him near the QB — that's a handoff in stride, not a
    // thrown pass, even though the ball path starts right next to the QB.
    const airThrow = !!namedCarrierG && carrierLabel!=="QB" && namedCarrierG!==motionMan
      && Math.hypot(sPt.x-qx, sPt.y-qy) < 14
      && Math.hypot(sPt.x-(+namedCarrierG.dataset.x), sPt.y-(+namedCarrierG.dataset.y)) >= 14;
    const carrier = airThrow ? null : (motionMan || nearestPlayer(svg,sPt.x,sPt.y));

    dot.setAttribute("opacity","1");
    dot.style.fill = "";                                                   // reset to true-ball red at the top of every run
    const shotgun = Math.hypot(qx-cx, qy-cy) > 32;                         // deep QB = shotgun
    const snapDur = (shotgun ? 260 : 90)*speed;                            // long snap vs hand-to-hand
    const qbKeeps = !airThrow && (carrier===qg || Math.hypot(sPt.x-qx, sPt.y-qy) < 14);
    const fakeEl = svg.querySelector('[data-kind="fake"]');
    const qbFakes = qbKeeps && !!fakeEl;                                   // boots: fake the give first
    // A thrown pass from under center (not shotgun): the QB should visibly drop
    // back into the pocket before he throws — he doesn't just stand at the LOS.
    // Shotgun snaps (Deuce) already start him back there, so skip it for those.
    const qbDrops = airThrow && !shotgun;
    // Play-action pass: sell the same handoff fake as a run play, but the ball
    // never actually reaches the back — it just rubs against him and comes right
    // back to the QB before he throws.
    const isPA = svg.dataset.pa === "1";
    const airFakes = airThrow && isPA && !!fakeEl;
    const meshDur = qbKeeps ? 0 : 300*speed;
    const fakeDur = qbFakes ? 500*speed : 0;
    const toss = svg.dataset.xfer==="toss";
    // The carrier takes off AT the snap — nobody stands around waiting
    const carrierDelay = qbKeeps ? snapDur+fakeDur : D.snapDelay;
    if(carrier) jobs.push(move(carrier, ballLine, D.ball, carrierDelay, {trace:true}).then(()=>{carrierDone=true;}));
    // QB reverses out to meet the back where he's headed
    if(!qbKeeps && carrier && !airThrow){
      jobs.push(gmove(qg, qx+(sPt.x-qx)*0.55, qy+(sPt.y-qy)*0.55, meshDur+80*speed, snapDur));
    }
    jobs.push((async()=>{
      await lerpMove(dot, cx, cy, qx, qy, snapDur);                        // the hike
      if(runRef.id!==myRun) return;
      if(qbDrops){
        // Drop straight back into the pocket a few steps (away from the LOS).
        // Play-action takes a deeper drop than a quick 3-step throw.
        // In the defensive (flipped) view, the whole field is mirrored top-to-bottom,
        // so "away from the LOS" is a DECREASE in screen y instead of an increase —
        // without this, the QB's drop-back walks the wrong way and looks like he's
        // charging through the line instead of retreating into the pocket.
        const dropDist = (isPA ? 45 : 22) * (svg.dataset.flip==="1" ? -1 : 1);
        await gmove(qg, qx, qy+dropDist, 260*speed, 0);
        if(runRef.id!==myRun) return;
      }
      if(qbFakes){
        const f = pathStart(fakeEl);
        const fb = nearestPlayer(svg, f.x, f.y);
        if(fb){
          dot.style.fill = "var(--fakeball)";                             // gray = not a real handoff
          await chase(dot, fb, fakeDur*0.5);                               // stick it in the belly...
          if(runRef.id!==myRun) return;
          await chase(dot, qg, fakeDur*0.5);                               // ...pull it back — FAKE!
          if(runRef.id!==myRun) return;
          dot.style.fill = "";                                             // back to red once the fake's over
        }
      } else if(airFakes){
        // Same "stick it in the belly, then pull it back" fake, but the eventual
        // target is a receiver downfield rather than the QB keeping it himself.
        const f = pathStart(fakeEl);
        const fb = nearestPlayer(svg, f.x, f.y);
        if(fb){
          const paFakeDur = 500*speed;
          dot.style.fill = "var(--fakeball)";                             // gray = not a real handoff
          await chase(dot, fb, paFakeDur*0.5);
          if(runRef.id!==myRun) return;
          await chase(dot, qg, paFakeDur*0.5);
          if(runRef.id!==myRun) return;
          dot.style.fill = "";                                             // back to red once the fake's over
        }
      }
      if(airThrow){
        // QB throws from wherever he's ended up standing — the ball arcs
        // downfield on its own, landing where the receiver's own route brings him.
        const p = getPos(qg);
        const end = ballLine.getPointAtLength(ballLine.getTotalLength());
        const h = Math.min(70, Math.hypot(end.x-p.x, end.y-p.y)*0.22);
        await arcMove(dot, p.x, p.y, end.x, end.y, Math.max(200,D.ball-snapDur), 0, h, ballLine);
        if(runRef.id!==myRun) return;
        carrierDone = true;
      } else if(!qbKeeps && carrier){
        if(toss){
          const lead = ballLine.getPointAtLength(ease(Math.min(1,(snapDur+meshDur)/D.ball))*ballLine.getTotalLength());
          await arcMove(dot, qx, qy, lead.x, lead.y, meshDur, 0, 22, null); // pitch leads the runner
        } else {
          await chase(dot, carrier, meshDur);                               // handoff at the moving mesh
        }
        if(runRef.id!==myRun) return;
      }
      if(!airThrow) await attach(dot, carrier||qg, ()=>carrierDone);        // ball rides with the runner
    })());
  }
  // Second-level defense flows to the ball at the snap — blockers hit MOVING targets
  {
    const endLine = throwLine || ballLine;
    if(endLine){
      const E = endLine.getPointAtLength(endLine.getTotalLength());
      const blockEnds = [...svg.querySelectorAll('[data-kind="block"]')].map(b=>b.getPointAtLength(b.getTotalLength()));
      svg.querySelectorAll(".dlab[data-d]").forEach(tx=>{
        const role = tx.dataset.d;
        if(role==="dl") return;                                             // front four are engaged
        const x=+tx.getAttribute("x"), y=+tx.getAttribute("y");
        let k = role==="lb" ? 0.5 : 0.32;                                   // LBs scrape hard, DBs converge
        if(blockEnds.some(p=>Math.hypot(p.x-x,p.y-y)<28)) k*=0.35;          // blocked men fight through slower
        jobs.push(dmove(tx, x+(E.x-x)*k, y+(E.y-y)*k, D.ball*0.9, D.snapDelay+140*speed));
      });
    }
  }
  await Promise.all(jobs);
  if(freezeTimer) clearTimeout(freezeTimer);
  if(runRef.id!==myRun) return;
  if(throwLine && dot){
    const a = pathStart(throwLine);
    const b = throwLine.getPointAtLength(throwLine.getTotalLength());
    const h = Math.min(60, Math.hypot(b.x-a.x, b.y-a.y)*0.18);             // deeper throw = higher arc
    await arcMove(dot, a.x, a.y, b.x, b.y, D.throw, 120*speed, h, throwLine);
  }
}
// Staged tapping: pre-snap → tap = run the WHOLE play start to finish →
// tap again WHILE it's running = freeze it right where it is → tap = reset
const STAGE_NOTES = ["Tap: snap it — run the play ▶",
                     "Tap to FREEZE it right where it is ⏸",
                     "Tap: reset to pre-snap ↺"];
const STAGE_PILLS = ["PRE-SNAP","▶ PLAYING — tap to freeze","⏸ FROZEN"];
function ensurePill(dg){
  let pill = dg.querySelector(".stagepill");
  if(!pill){ pill=document.createElement("span"); pill.className="stagepill"; dg.appendChild(pill); }
  return pill;
}
function armStaged(container){
  container.querySelectorAll(".diagram").forEach(dg=>{
    const svg = dg.querySelector("svg");
    const note = dg.parentElement.querySelector(".tapnote");
    const pill = ensurePill(dg);
    const setNote = ()=>{
      if(note) note.textContent = STAGE_NOTES[+svg.dataset.stage];
      pill.textContent = STAGE_PILLS[+svg.dataset.stage];
    };
    setNote();
    dg.addEventListener("click", async ()=>{
      const stage = +svg.dataset.stage;
      if(stage===0){
        // Run the whole play, start to finish — no forced freeze partway through.
        svg.dataset.stage="1"; setNote(); stats.studyRuns++; saveStats(); checkBadges();
        await simulate(svg, 2.1);
        if(+svg.dataset.stage===1){ svg.dataset.stage="2"; setNote(); }
      } else if(stage===1){
        // Freeze it right where it is, right now.
        if(svg._runIdRef) svg._runIdRef.id++;
        svg.dataset.stage="2"; setNote();
      } else {
        svg.dataset.stage="0"; if(svg._runIdRef) svg._runIdRef.id++; resetBoard(svg); setNote();
      }
    });
  });
}

function bookItemHTML(p, myPos){
  const m = playMisses(p);
  const badge = m>0 ? ` <span style="color:var(--red);font-size:13px;letter-spacing:.3px">⚠ missed ${m}×</span>` : "";
  const flip = ["dl","lb","db"].includes(myPos);
  return `
  <div class="bookitem collapsed" data-play="${p.name}">
    <button class="bookhead" aria-expanded="false">
      <span><h3 style="display:inline">${p.name}</h3>${badge}<br>
      <span class="dest">${DESTS[p.dest]} • ${FORMS[p.form].label}${flip?" • DEFENSE VIEW":""}</span></span>
      <span class="caret">▸</span>
    </button>
    <div class="bookbody"></div>
  </div>`;
}
function wireStudySearch(){
  const se = document.getElementById("playsearch");
  if(!se) return;
  se.addEventListener("input", ()=>{
    studySearch = se.value;
    clearTimeout(se._deb);
    se._deb = setTimeout(()=>{
      const pos = se.selectionStart;
      renderStudy();
      const se2 = document.getElementById("playsearch");
      if(se2){ se2.focus(); try{ se2.setSelectionRange(pos,pos); }catch(e){} }
    }, 220);
  });
}
function renderStudy(){
  screen="study"; setLegend(true);
  if(!POSITIONS.some(p=>p.key===myPos)) myPos="team";
  const posLabel = POSITIONS.find(p=>p.key===myPos).label;
  setTopbar(`Study • ${posLabel}`, false);
  const chips = POSITIONS.map(p=>`<button class="chip ${myPos===p.key?'active':''}" data-pos="${p.key}">${p.label}</button>`).join("");
  const anyMisses = PLAYS.some(p=>weakScore(p)>0);
  const sortChips = `
    <button class="chip ${studySort==="book"?'active':''}" data-sort="book">Playbook order</button>
    <button class="chip ${studySort==="weak"?'active':''}" data-sort="weak">⚠ Weak spots first${anyMisses?"":" (no misses yet!)"}</button>`;
  const q = studySearch.trim().toLowerCase();
  const matches = p => !q || p.name.toLowerCase().includes(q) || p.tip.toLowerCase().includes(q) || FORMS[p.form].label.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q);
  let filtered = PLAYS.filter(matches);
  if(studySort==="weak") filtered = [...filtered].sort((a,b)=> weakScore(b)-weakScore(a));

  let bodyHTML;
  if(q){
    bodyHTML = filtered.length
      ? `<div class="bookgrid">${filtered.map(p=>bookItemHTML(p,myPos)).join("")}</div>`
      : `<p class="prompt" style="color:var(--chalk-dim)">No plays match "${studySearch}". Try a play name, formation, or hole number.</p>`;
  } else {
    bodyHTML = STUDY_SECTIONS.map(sec=>{
      const secPlays = filtered.filter(p=>p.sec===sec);
      if(!secPlays.length) return "";
      const catsHTML = STUDY_CATS.map(cat=>{
        const catPlays = secPlays.filter(p=>p.cat===cat);
        if(!catPlays.length) return "";
        return `
        <div class="subgroup collapsed" data-sub="${sec}-${cat}">
          <button class="subhead" aria-expanded="false"><span>${cat} <span style="opacity:.7">(${catPlays.length})</span></span><span class="caret">▸</span></button>
          <div class="subbody"><div class="bookgrid">${catPlays.map(p=>bookItemHTML(p,myPos)).join("")}</div></div>
        </div>`;
      }).join("");
      return `
      <div class="secgroup collapsed" data-sec="${sec}">
        <button class="sechead" aria-expanded="false"><span>${sec} <span style="opacity:.7">(${secPlays.length} plays)</span></span><span class="caret">▸</span></button>
        <div class="secbody">${catsHTML}</div>
      </div>`;
    }).join("");
  }

  card.innerHTML = `
    <div class="poswrap" style="margin-bottom:10px">
      <h3>Tips for:</h3>
      <div class="poschips">${chips}</div>
    </div>
    <div class="poswrap" style="margin-bottom:10px">
      <h3>Order:</h3>
      <div class="poschips">${sortChips}</div>
    </div>
    <div class="poswrap" style="margin-bottom:14px">
      <input type="search" id="playsearch" class="searchbox" placeholder="🔎 Search plays — name, formation, or hole number..." value="${studySearch.replace(/"/g,'&quot;')}">
    </div>
    ${bodyHTML}`;
  const studyFlip = ["dl","lb","db"].includes(myPos);
  card.querySelectorAll(".bookhead").forEach(h=>h.addEventListener("click",()=>{
    const item = h.parentElement;
    if(!item.classList.contains("collapsed")){
      item.classList.add("collapsed"); h.setAttribute("aria-expanded","false"); return;
    }
    item.classList.remove("collapsed"); h.setAttribute("aria-expanded","true");
    const body = item.querySelector(".bookbody");
    if(!body.dataset.built){
      const p = PLAYS.find(x=>x.name===item.dataset.play);
      body.innerHTML = `
        <div><div class="diagram">${playSVG(p, studyFlip)}</div><p class="tapnote"></p></div>
        <div class="hint pre"><b>Before the snap</b>${p.pre}</div>
        <div class="hint post"><b>After the snap</b>${p.post}</div>
        <div class="hint pos"><b>${posLabel} tip</b>${posTip(p)}</div>`;
      body.dataset.built="1";
      armStaged(body);
    }
  }));
  card.querySelectorAll(".sechead").forEach(h=>h.addEventListener("click",()=>{
    const item = h.parentElement;
    item.classList.toggle("collapsed");
    h.setAttribute("aria-expanded", (!item.classList.contains("collapsed")).toString());
  }));
  card.querySelectorAll(".subhead").forEach(h=>h.addEventListener("click",()=>{
    const item = h.parentElement;
    item.classList.toggle("collapsed");
    h.setAttribute("aria-expanded", (!item.classList.contains("collapsed")).toString());
  }));
  card.querySelectorAll(".chip[data-pos]").forEach(c=>c.addEventListener("click",()=>{
    myPos=c.dataset.pos;
    renderStudy();
    window.scrollTo({top:0});
  }));
  card.querySelectorAll(".chip[data-sort]").forEach(c=>c.addEventListener("click",()=>{
    studySort=c.dataset.sort;
    renderStudy();
    window.scrollTo({top:0});
  }));
  wireStudySearch();
}
// ---- GLOSSARY ----
const GLOSSARY = [
  {group:"Offense — the players (circles on the bottom of the board)", items:[
    ["QB","Quarterback — the solid white circle. Takes the snap and hands off, runs, or throws."],
    ["FB","Fullback — lines up right behind the QB. Power runner, carries most of the Belly/Weak Belly/Scissors/reverse plays."],
    ["HB","Halfback — the other running back. Carries the sweep, dive, and slip plays, and leads blocks when the FB has the ball."],
    ["WB","Wingback — lines up outside the tight end in Wing-T and Double formations. Blocks, goes in motion, or carries on Jet plays."],
    ["C","Center (the square on the line) — snaps the ball to the QB, then blocks."],
    ["LG / RG","Left Guard / Right Guard — linemen on each side of the Center."],
    ["LT / RT","Left Tackle / Right Tackle — linemen outside the Guards."],
    ["TE","Tight End — lines up right next to the Tackle on the strong side. Blocks on runs, catches passes too."],
    ["X","The single receiver split out on the weak side (opposite the TE) in every non-Deuce formation, and the backside receiver in Deuce."],
    ["SL","Slot — the inside receiver on the strong side in Deuce formation. No tight end in Deuce — three receivers instead."],
    ["Y","The outside receiver on the strong side in Deuce formation, furthest from the ball."],
  ]},
  {group:"Defense — the letters across the top of the board", items:[
    ["E","Defensive End — the outside edge of the line. Sets the edge on runs, rushes the QB on passes."],
    ["N","Nose — the defensive lineman lined up over the Center."],
    ["T","Defensive Tackle — the big lineman inside, next to the Nose."],
    ["W","Will — the weakside linebacker (away from the tight end)."],
    ["M","Mike — the middle linebacker. Usually the defense's play-caller."],
    ["S","Sam — the strongside linebacker (lined up toward the tight end)."],
    ["C","Cornerback — covers the wide receivers out wide."],
    ["FS","Free Safety — deep defender who reads the QB and helps wherever the ball goes."],
    ["SS","Strong Safety — deep defender on the tight end's side. Helps more against the run."],
    ["4-3","The defense shown on the boards: 4 linemen (E, N, T, E) and 3 linebackers (W, M, S)."],
  ]},
  {group:"Play-call words", items:[
    ["100 / 900","The formation direction. 100 = strength (tight end + wing) on the RIGHT. 900 = flipped, strength on the LEFT."],
    ["Hole numbers","The last number in a call is where the ball is headed. 1 is the widest hole on the RIGHT (the sweep), 5 is straight behind the Center, and 9 is the widest hole on the LEFT (the sweep the other way) — everything else counts down from right to left in between."],
    ["BOOT","Bootleg — the QB drops back, fakes the handoff on the live run play, then rolls AWAY from the fake to pass. Built to punish defenses that chase the fake."],
    ["PA","Play Action — fake a run first, then throw. Fools linebackers into stepping up."],
    ["JET","A player (usually the WB) sprints across the formation in real motion before the snap and takes the handoff at full speed."],
    ["SCISSORS","Misdirection — one back fakes the belly one way while the other back is the REAL carrier, hitting the hole from the opposite hip."],
    ["WEAK BELLY","A belly run that goes AWAY from the formation's strong side (the TE/WB side) instead of toward it."],
    ["ROGER / LUCY","Reverse plays out of Wing-T, Open, or Double formation. Roger is always strong-right (motion goes right-to-left); Lucy is always strong-left (motion goes left-to-right). The guard does NOT pull on these — the WB's real pre-snap motion is the misdirection."],
    ["DOUBLE DIVE","Two backs slam into the line at the same time; only one has the ball."],
    ["DOUBLE FORMATION","A formation with two wing-type backs instead of one — the WB stays outside the TE, and the HB moves up to a second wing spot on the weak side."],
    ["TOSS","The QB tosses it out to a back, usually with a backside lineman pulling to lead him around the corner (see Double 12/18)."],
    ["BUBBLE","A quick screen pass — the Slot receiver swings toward the sideline and catches it right away with blockers in front."],
    ["HITCH","A short route: run 5 steps, stop, and turn around for a quick throw."],
    ["STUTTER (& GO)","Fake the hitch, then sprint deep past the defender. The home-run double move."],
    ["SLIP","The back sneaks flat behind the line before taking off around the corner."],
  ]},
  {group:"Words on the boards", items:[
    ["Red dot / line","The football and the path it travels."],
    ["Dashed gray line","A fake — that player pretends to have the ball."],
    ["Gray line","A blocking assignment — the defender that player is responsible for."],
    ["Thin gray arrow","A pass route."],
    ["Motion","A player legally moving before the snap (the dotted red path)."],
    ["LOS","Line of Scrimmage — the solid white line where the ball starts. Nobody crosses it before the snap."],
  ]},
];
function renderGlossary(){
  screen="glossary"; setTopbar("Glossary", false); setLegend(false);
  card.innerHTML = GLOSSARY.map(g=>`
    <div class="bookitem" style="margin-bottom:16px">
      <h3>${g.group}</h3>
      ${g.items.map(([term,def])=>`
        <div class="hint pre" style="margin-top:8px"><b style="color:var(--yellow)">${term}</b>${def}</div>`).join("")}
    </div>`).join("");
}
// ---- BADGES SCREEN ----
function renderBadges(){
  screen="badges"; setTopbar("Level & Badges", false); setLegend(false);
  const lv=levelOf(stats.xp);
  card.innerHTML = `
    <p class="prompt">Level: <b style="color:var(--yellow)">${lv.name}</b> — ${stats.xp} XP • ${stats.correct} correct answers all-time</p>
    <div class="badgegrid">${BADGES.map(b=>{
      const got=stats.badges.includes(b.id);
      return `<div class="badge ${got?"earned":"locked"}"><div class="bi">${b.icon}</div><h4>${b.name}</h4><p>${b.desc}</p></div>`;
    }).join("")}</div>
    <button class="chip" id="resetlevel" style="margin-top:16px">↺ Reset level &amp; badges</button>`;
  const resetBtn = document.getElementById("resetlevel");
  let armed=false, armTimer=null;
  resetBtn.addEventListener("click", ()=>{
    if(!armed){
      armed=true;
      resetBtn.textContent="Tap again to confirm — can't be undone";
      resetBtn.style.color="var(--red)"; resetBtn.style.borderColor="var(--red)";
      clearTimeout(armTimer);
      armTimer=setTimeout(()=>{
        armed=false;
        resetBtn.textContent="↺ Reset level & badges";
        resetBtn.style.color=""; resetBtn.style.borderColor="";
      }, 3500);
      return;
    }
    clearTimeout(armTimer);
    resetLevelAndBadges();
    renderBadges();
    showToast("↺ Level and badges reset");
  });
}
// ---- COACH'S CHALLENGE (daily) ----
function todayKey(){ return new Date().toISOString().slice(0,10); }
function dailyPlay(){ return PLAYS[Math.floor(Date.now()/864e5) % PLAYS.length]; }
function renderDaily(){
  screen="daily"; setTopbar("Coach's Challenge", false); setLegend(true);
  const p = dailyPlay();
  const alreadyDone = stats.daily.last===todayKey();
  const qs = [
    {prompt:"1 of 3 — What play is on the board?",
     opts: shuffle([p, ...shuffle(PLAYS.filter(x=>x!==p)).slice(0,3)]).map(x=>[x.name, x===p])},
    {prompt:"2 of 3 — Where does the ball go?",
     opts: Object.entries(DESTS).map(([k,v])=>[v, k===p.dest])},
    {prompt:"3 of 3 — What formation is it run from?",
     opts: shuffle(Object.keys(FORMS)).map(f=>[FORMS[f].label, f===p.form])},
  ];
  let qi=-1, got=0;
  function draw(){
    if(qi===-1){
      card.innerHTML = `
        <p class="prompt">Today's featured play${alreadyDone?" — you already finished today, but reps never hurt!":""}. Study the board, then answer 3 questions from memory.</p>
        <div><div class="diagram">${playSVG(p)}</div><p class="tapnote"></p></div>
        <div class="hint pre"><b>Before the snap</b>${p.pre}</div>
        <button class="nextbtn" id="startq">I'm ready — start the questions ▶</button>`;
      armStaged(card);
      document.getElementById("startq").addEventListener("click", ()=>{ qi=0; draw(); });
      return;
    }
    if(qi>=qs.length){ finishDaily(); return; }
    const q=qs[qi];
    card.innerHTML = `
      <p class="prompt">${q.prompt}</p>
      <div class="answers">${q.opts.map(([label,ok])=>`<button class="ans" data-ok="${ok?1:0}">${label}</button>`).join("")}</div>`;
    card.querySelectorAll(".ans").forEach(b=>b.addEventListener("click",()=>{
      const right = b.dataset.ok==="1";
      card.querySelectorAll(".ans").forEach(x=>{
        x.disabled=true;
        if(x.dataset.ok==="1")x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");
      });
      feedbackFX(right);
      if(right){ got++; snd("good"); } else snd("bad");
      setTimeout(()=>{ qi++; draw(); }, 900);
    }));
  }
  function finishDaily(){
    if(!alreadyDone){
      const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
      stats.daily.streak = stats.daily.last===y ? stats.daily.streak+1 : 1;
      stats.daily.last = todayKey();
      stats.daily.done++;
    }
    awardXP(got*15);
    saveStats(); checkBadges();
    if(got===3){ confetti(90); snd("quack"); }
    card.innerHTML = `
      <p class="prompt" style="font-size:24px;font-weight:800">${got===3?"💯 Perfect — 3 for 3!":got+" of 3 correct"}</p>
      <p class="prompt" style="color:var(--chalk-dim)">Daily streak: <b style="color:var(--yellow)">${stats.daily.streak} day${stats.daily.streak===1?"":"s"}</b> — a new play drops tomorrow. Go Trojans!</p>
      <button class="nextbtn" id="tohome2">◀ Back to Home</button>`;
    document.getElementById("tohome2").addEventListener("click", renderHome);
  }
  draw();
}
renderHome();
</script>
