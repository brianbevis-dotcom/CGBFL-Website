<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CGBFL Game Day Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk:#FBFAF8;
    --paper:#FFFFFF;
    --ink:#14110F;
    --ink-soft:#5C5651;
    --ink-faint:#8E8781;
    --rule:#E3DFD8;
    --red:#C8102E;
    --red-deep:#8B0000;
    --turf:#2F5D3A;
    --sp-t:#1B7F3B;      /* tackle  - green */
    --sp-gf:#D6336C;     /* girls flag - pink */
    --sp-kf:#E8A400;     /* K/1 flag - yellow */
    --live:#0A7D3E;
    --warn:#B45309;
    --pad:16px;
    --lane:104px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--chalk);
    color:var(--ink);
    font-family:"Barlow Condensed",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:17px;
    line-height:1.3;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad) 64px;}

  /* ---------- Masthead ---------- */
  .mast{
    background:var(--ink);
    color:var(--paper);
    padding:14px var(--pad) 12px;
    position:relative;
    overflow:hidden;
  }
  .mast::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
    background:linear-gradient(90deg,var(--red) 0 33.3%,var(--paper) 33.3% 66.6%,var(--red) 66.6%);
  }
  .mast-inner{max-width:1180px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .mast h1{
    font-family:Anton,Impact,sans-serif;font-weight:400;
    font-size:clamp(26px,6vw,40px);letter-spacing:.02em;
    text-transform:uppercase;margin:0;line-height:.95;
  }
  .mast h1 em{font-style:normal;color:var(--red);}
  .mast .sub{
    font-size:13px;letter-spacing:.16em;text-transform:uppercase;
    color:#B9B2AC;font-weight:600;
  }
  .clock{margin-left:auto;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#B9B2AC;font-weight:600;}

  /* ---------- Controls ---------- */
  .controls{
    position:sticky;top:0;z-index:40;
    background:var(--chalk);
    border-bottom:1px solid var(--rule);
    padding-top:10px;
  }
  .controls-inner{max-width:1180px;margin:0 auto;padding:0 var(--pad);}
  .ctl-label{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:700;margin:0 0 6px;
  }
  .quickrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;
    background:var(--paper);color:var(--ink);
    border:1.5px solid var(--ink);border-radius:2px;
    padding:6px 12px;cursor:pointer;
    transition:background .12s,color .12s;
  }
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.ghost{border-color:var(--rule);color:var(--ink-soft);}
  .btn.ghost:hover{background:var(--rule);color:var(--ink);}
  .btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible{
    outline:3px solid var(--red);outline-offset:2px;
  }

  .daystrip{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;
    scrollbar-width:thin;-webkit-overflow-scrolling:touch;
  }
  .chip{
    flex:0 0 auto;min-width:62px;
    background:var(--paper);border:1.5px solid var(--rule);border-radius:3px;
    padding:6px 10px 7px;cursor:pointer;text-align:center;
    font-family:inherit;color:var(--ink);
    transition:border-color .12s,background .12s;
  }
  .chip .dow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .chip .dnum{font-family:Anton,sans-serif;font-size:22px;line-height:1.05;display:block;}
  .chip .mon{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}
  .chip .cnt{font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:1px;}
  .chip:hover{border-color:var(--ink-faint);}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .chip[aria-pressed="true"] .dow,.chip[aria-pressed="true"] .mon,.chip[aria-pressed="true"] .cnt{color:#B9B2AC;}
  .chip.is-today{border-color:var(--red);}
  .chip.is-today .dow{color:var(--red);}
  .chip[aria-pressed="true"].is-today{background:var(--red);border-color:var(--red);}
  .chip[aria-pressed="true"].is-today .dow,.chip[aria-pressed="true"].is-today .mon,.chip[aria-pressed="true"].is-today .cnt{color:#FFD9DE;}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:10px;}
  .seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;}
  .seg button{
    font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    background:var(--paper);color:var(--ink);border:0;border-right:1px solid var(--rule);
    padding:6px 11px;cursor:pointer;
  }
  .seg button:last-child{border-right:0;}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
  select,input[type="search"]{
    font-family:inherit;font-size:15px;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--rule);border-radius:2px;
    padding:6px 9px;min-height:34px;
  }
  input[type="search"]{flex:1 1 190px;min-width:150px;}

  /* ---------- Summary ---------- */
  .summary[hidden]{display:none;}
  .summary{
    display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;
    padding:14px 0 4px;border-bottom:2px solid var(--ink);margin-bottom:2px;
  }
  .summary .big{font-family:Anton,sans-serif;font-size:30px;line-height:1;}
  .summary .lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .summary .unit{display:flex;align-items:baseline;gap:7px;}

  /* ---------- Day heading ---------- */
  .dayhead{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    margin:26px 0 0;padding-bottom:6px;border-bottom:1px solid var(--rule);
  }
  .dayhead h2{
    font-family:Anton,sans-serif;font-weight:400;font-size:clamp(20px,4.4vw,27px);
    text-transform:uppercase;letter-spacing:.02em;margin:0;
  }
  .dayhead .meta{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}

  /* ---------- Time slot ---------- */
  .slot{display:grid;grid-template-columns:92px 1fr;gap:0 16px;padding:14px 0 4px;border-bottom:1px solid var(--rule);}
  .slot:last-child{border-bottom:0;}
  .slot-time{position:relative;padding-top:2px;}
  .slot-time .hh{
    font-family:Anton,sans-serif;font-size:28px;line-height:.9;letter-spacing:.01em;display:block;
  }
  .slot-time .ampm{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .slot-time .ct{font-size:12px;color:var(--ink-faint);font-weight:600;margin-top:5px;}
  .slot.live .slot-time .hh{color:var(--live);}
  .badge-live{
    display:inline-block;margin-top:6px;
    background:var(--live);color:#fff;font-size:10px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;padding:2px 6px;border-radius:2px;
  }
  .badge-next{
    display:inline-block;margin-top:6px;
    background:var(--red);color:#fff;font-size:10px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;padding:2px 6px;border-radius:2px;
  }

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:8px;padding-bottom:12px;}

  /* ---------- Game card ---------- */
  .game{
    position:relative;background:var(--paper);
    border:1px solid var(--rule);border-radius:3px;
    padding:9px 11px 9px 20px;overflow:hidden;
  }
  .spine{position:absolute;left:0;top:0;bottom:0;width:9px;display:flex;flex-direction:column;}
  .spine i{flex:1;display:block;}
  .game.past{opacity:.5;}
  .game-top{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
  .tag{
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:2px 5px;border-radius:2px;
  }
  .tag.sport-T{background:var(--ink);color:var(--paper);}
  .tag.sport-F{background:var(--rule);color:var(--ink);}
  .tag.div{background:transparent;color:var(--ink-soft);border:1px solid var(--rule);}
  .field{
    margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--red-deep);white-space:nowrap;
  }
  .matchup{font-size:19px;font-weight:600;line-height:1.15;margin:0 0 2px;}
  .matchup .vs{color:var(--ink-faint);font-weight:500;font-size:14px;padding:0 3px;}
  .kick{font-size:12px;color:var(--ink-faint);font-weight:600;letter-spacing:.06em;}
  .crew{
    margin-top:7px;padding-top:6px;border-top:1px dotted var(--rule);
    font-size:13px;color:var(--ink-soft);display:grid;gap:2px;
  }
  .crew div{display:flex;gap:5px;}
  .crew b{
    flex:0 0 58px;font-size:10px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-faint);padding-top:2px;
  }
  .crew .val{flex:1;}
  .crew .gap{color:var(--warn);font-weight:600;}
  .tower .val{color:var(--turf);font-weight:600;}

  /* ---------- Empty ---------- */
  .tag.sport-C{background:#6B21A8;color:var(--paper);}
  /* sport tags */
  .tag.sport-T{background:var(--sp-t);color:var(--paper);}
  .tag.sport-GF{background:var(--sp-gf);color:var(--paper);}
  .tag.sport-KF{background:var(--sp-kf);color:#3A2A00;}
  .tag.tent{background:transparent;color:var(--warn);border:1px dashed var(--warn);}
  .score{
    margin-top:4px;font-family:Anton,sans-serif;font-size:15px;letter-spacing:.02em;
  }
  .score .w{color:var(--sp-t);}
  .score .sep{color:var(--ink-faint);font-size:12px;padding:0 4px;}

  /* view switch */
  .viewswitch{display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;margin-left:auto;}
  .viewswitch button{
    font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    background:var(--paper);color:var(--ink);border:0;border-right:1px solid var(--rule);
    padding:6px 11px;cursor:pointer;
  }
  .viewswitch button:last-child{border-right:0;}
  .viewswitch button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}

  /* legend */
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:14px 0 4px;font-size:12px;
          letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:13px;height:13px;border-radius:2px;display:inline-block;}

  /* ---- timeline ---- */
  .tl{margin-top:10px;overflow-x:auto;padding-bottom:6px;}
  .tl-inner{min-width:660px;}
  .tl-axis{display:grid;align-items:end;height:20px;margin-left:var(--lane);
           border-bottom:1px solid var(--rule);position:relative;}
  .tl-axis span{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-faint);
                transform:translateX(-50%);white-space:nowrap;position:absolute;bottom:3px;}
  .tl-row{display:flex;align-items:stretch;border-bottom:1px solid var(--rule);min-height:36px;}
  .tl-row:last-child{border-bottom:0;}
  .tl-lane{
    flex:0 0 var(--lane);padding:9px 10px 9px 0;
    font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink);display:flex;align-items:center;
  }
  .tl-track{position:relative;flex:1;margin:6px 0;}
  .tl-grid{position:absolute;inset:0;}
  .tl-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--rule);}
  .tl-grid i.hour{background:#D5D0C8;}
  .tl-bar{
    position:absolute;top:0;bottom:0;border-radius:2px;
    display:flex;align-items:center;padding:0 6px;overflow:hidden;
    font-size:12px;font-weight:600;letter-spacing:.02em;color:#fff;white-space:nowrap;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .tl-bar.sp-T{background:var(--sp-t);}
  .tl-bar.sp-GF{background:var(--sp-gf);}
  .tl-bar.sp-KF{background:var(--sp-kf);color:#3A2A00;}
  .tl-bar.tent{opacity:.55;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 5px,transparent 5px 10px);}
  .tl-bar b{font-weight:700;}
  .tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3;}
  .tl-now::after{content:"NOW";position:absolute;top:-16px;left:50%;transform:translateX(-50%);
                 background:var(--red);color:#fff;font-size:9px;font-weight:700;letter-spacing:.12em;
                 padding:1px 4px;border-radius:2px;}
  .tl-daylabel{font-family:Anton,sans-serif;font-size:15px;text-transform:uppercase;margin:16px 0 0;}
  .tl-empty{font-size:13px;color:var(--ink-faint);padding:10px 0;}
  @media (max-width:560px){ .tl-inner{min-width:560px;} }

  .feedbar{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    margin:12px 0 0;padding:7px 11px;
    border:1px solid var(--rule);border-left:3px solid var(--ink-faint);
    border-radius:2px;background:var(--paper);
    font-size:13px;color:var(--ink-soft);letter-spacing:.03em;
  }
  .feedbar[hidden]{display:none;}
  .feedbar.live{border-left-color:var(--live);}
  .feedbar.stale{border-left-color:var(--warn);}
  .feedbar.offline{border-left-color:var(--red);}
  .feedbar .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:0 0 auto;}
  .feedbar.live .dot{background:var(--live);}
  .feedbar.stale .dot{background:var(--warn);}
  .feedbar.offline .dot{background:var(--red);}
  .btn.sm{font-size:12px;padding:3px 9px;margin-left:auto;}
  .empty{
    text-align:center;padding:56px 20px;border:2px dashed var(--rule);
    border-radius:4px;margin-top:26px;
  }
  .empty h3{font-family:Anton,sans-serif;font-weight:400;font-size:22px;text-transform:uppercase;margin:0 0 6px;}
  .empty p{margin:0 0 14px;color:var(--ink-soft);}

  .foot{
    margin-top:30px;padding-top:12px;border-top:1px solid var(--rule);
    font-size:12px;color:var(--ink-faint);letter-spacing:.06em;
  }

  @media (max-width:560px){
    .slot{grid-template-columns:70px 1fr;gap:0 11px;}
    .slot-time .hh{font-size:23px;}
    .cards{grid-template-columns:1fr;}
    .matchup{font-size:18px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  @media print{
    .controls,.mast .clock,.foot,.quickrow{display:none;}
    body{background:#fff;font-size:12px;}
    .game{break-inside:avoid;border-color:#bbb;}
    .slot{break-inside:avoid;}
    .cards{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>

<header class="mast">
  <div class="mast-inner">
    <h1>Trojans <em>Game Day</em></h1>
    <span class="sub">Center Grove Bantam Football</span>
    <span class="clock" id="clock"></span>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <p class="ctl-label">Pick a day — or tap several to combine them</p>
    <div class="quickrow">
      <button class="btn" id="btnToday">Today</button>
      <button class="btn ghost" id="btnWeekend">This weekend</button>
      <button class="btn ghost" id="btnWeek">Next 7 days</button>
      <button class="btn ghost" id="btnAll">Whole season</button>
      <button class="btn ghost" id="btnClear">Clear</button>
    </div>
    <div class="daystrip" id="daystrip" role="group" aria-label="Choose dates"></div>
    <div class="filters">
      <div class="seg" role="group" aria-label="Sport">
        <button data-sport="" aria-pressed="true">All</button>
        <button data-sport="T" aria-pressed="false">Tackle</button>
        <button data-sport="GF" aria-pressed="false">Girls Flag</button>
        <button data-sport="KF" aria-pressed="false">K–1 Flag</button>
      </div>
      <select id="fDiv" aria-label="Division"><option value="">All divisions</option></select>
      <select id="fField" aria-label="Field"><option value="">All fields</option></select>
      <input type="search" id="fSearch" placeholder="Search team, coach, or official">
      <div class="viewswitch" role="group" aria-label="View">
        <button data-view="list" aria-pressed="true">List</button>
        <button data-view="timeline" aria-pressed="false">Timeline</button>
      </div>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="summary" id="summary" hidden>
    <div class="unit"><span class="big" id="sGames">0</span><span class="lbl">Games</span></div>
    <div class="unit"><span class="big" id="sTackle">0</span><span class="lbl">Tackle</span></div>
    <div class="unit"><span class="big" id="sFlag">0</span><span class="lbl">Flag</span></div>
    <div class="unit"><span class="big" id="sFields">0</span><span class="lbl">Fields in use</span></div>
    <div class="unit"><span class="big" id="sFirst">—</span><span class="lbl">First kickoff</span></div>
  </div>
  <div class="feedbar" id="feedbar" hidden>
    <span class="dot" id="feedDot"></span>
    <span id="feedMsg">Loading live schedule…</span>
    <button class="btn ghost sm" id="btnRefresh" type="button">Refresh</button>
  </div>
  <div id="board"></div>
  <p class="foot" id="foot"></p>
</main>

s JV","cx":"Moore","sd":"","r1":"","r2":"","rn":"","tt":"","tc":"","hc":""},{"d":"2026-09-17","w":"Thu","t":"19:00","te":"20:00","sp":"KF","dv":"1st Grade","h":"Chiefs Varsity","a":"Titans Varsity","cx":"Adams","sd":"","r1":"","r2":"","rn":"","tt":"","tc":"","hc":""},{"d":"2026-09-17","w":"Thu","t":"19:00","te":"20:00","sp":"KF","dv":"1st Grade","h":"Cowboys Varsity","a":"Seahawks Varsity","cx":"Adams","sd":"","r1":"","r2":"","rn":"","tt":"","tc":"","hc":""},{"d":"2026-09-17","w":"Thu","t":"19:00","te":"20:00","sp":"KF","dv":"1st Grade","h":"Bears Varsity","a":"Colts","cx":"Moore","sd":"","r1":"","r2":"","rn":"","tt":"","tc":"","hc":""},{"d":"2026-09-17","w":"Thu","t":"19:00","te":"20:00","sp":"KF","dv":"1st Grade","h":"Broncos Varsity","a":"Bengals Varsity","cx":"Moore","sd":"","r1":"","r2":"","rn":"","tt":"","tc":"","hc":""},{"d":"2026-09-19","w":"Sat","t":"15:00","te":"16:30","sp":"T","dv":"Junior Trojans","h":"Plainfield","a":"Center Grove Junior Trojans","cx":"Collins","sd":"","r1":"","r2":"","rn":"","tt":"","tc":"","hc":"","tent":1},{"d":"2026-09-26","w":"Sat","t":"14:30","te":"16:00","sp":"T","dv":"Junior Trojans","h":"Carmel","a":"Center Grove Junior Trojans","cx":"Carmel field","sd":"","r1":"","r2":"","rn":"","tt":"","tc":"","hc":"","off":1,"tent":1}]};
const GAMES = DATA.games, TEAMS = DATA.teams;

/* ---------- helpers ---------- */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOWFULL = {Sun:"Sunday",Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday"};

function ymd(dt){
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}
function parseYMD(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function fmt12(t){
  const [H,M]=t.split(":").map(Number);
  const ap=H>=12?"PM":"AM", h=H%12===0?12:H%12;
  return {hh:h+":"+String(M).padStart(2,"0"), ampm:ap};
}
function minutes(t){const [H,M]=t.split(":").map(Number);return H*60+M;}
function fieldLabel(g){return g.sd ? g.cx+" "+g.sd : g.cx;}
const SPORT_LABEL={T:"Tackle",GF:"Girls Flag",KF:"K–1 Flag"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

const ALL_DATES = [...new Set(GAMES.map(g=>g.d))].sort();
const TODAY = ymd(new Date());

/* ---------- state ---------- */
const state = {dates:new Set(), sport:"", div:"", field:"", q:"", view:"list"};

/* ---------- build filter options ---------- */
(function(){
  const divs=[...new Set(GAMES.map(g=>g.dv))];
  const order=["Junior Trojans","Rookie","Minors","Majors","Kindergarten","1st Grade","2-4th Girls","5-6th Girls","7-8th Girls"];
  divs.sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);
  });
  const dSel=document.getElementById("fDiv");
  divs.forEach(d=>{const o=document.createElement("option");o.value=d;o.textContent=d;dSel.appendChild(o);});
  const fSel=document.getElementById("fField");
  [...new Set(GAMES.map(g=>g.cx))].sort().forEach(f=>{
    const o=document.createElement("option");o.value=f;o.textContent=f+" Field";fSel.appendChild(o);
  });
})();

/* ---------- day strip ---------- */
function buildStrip(){
  const strip=document.getElementById("daystrip");
  strip.innerHTML="";
  const counts={};
  GAMES.forEach(g=>{counts[g.d]=(counts[g.d]||0)+1;});
  ALL_DATES.forEach(d=>{
    const dt=parseYMD(d);
    const b=document.createElement("button");
    b.className="chip"+(d===TODAY?" is-today":"");
    b.type="button";
    b.setAttribute("aria-pressed", state.dates.has(d)?"true":"false");
    b.dataset.date=d;
    b.innerHTML='<span class="dow">'+(d===TODAY?"Today":GAMES.find(g=>g.d===d).w)+'</span>'+
                '<span class="dnum">'+dt.getDate()+'</span>'+
                '<span class="mon">'+MON[dt.getMonth()]+'</span>'+
                '<span class="cnt">'+counts[d]+' gm</span>';
    b.addEventListener("click",()=>{
      state.dates.has(d)?state.dates.delete(d):state.dates.add(d);
      b.setAttribute("aria-pressed", state.dates.has(d)?"true":"false");
      render();
    });
    strip.appendChild(b);
  });
}
function syncStrip(){
  document.querySelectorAll(".chip").forEach(c=>{
    c.setAttribute("aria-pressed", state.dates.has(c.dataset.date)?"true":"false");
  });
  const first=document.querySelector('.chip[aria-pressed="true"]');
  if(first) first.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
}

/* ---------- quick picks ---------- */
function setDates(list){state.dates=new Set(list);syncStrip();render();}
document.getElementById("btnToday").addEventListener("click",()=>{
  setDates(ALL_DATES.includes(TODAY)?[TODAY]:[nextDateOnOrAfter(TODAY)].filter(Boolean));
});
function nextDateOnOrAfter(d){return ALL_DATES.find(x=>x>=d)||ALL_DATES[ALL_DATES.length-1];}
document.getElementById("btnWeekend").addEventListener("click",()=>{
  const start=nextDateOnOrAfter(TODAY);
  if(!start) return setDates([]);
  const s=parseYMD(start);
  const toSat=(6-s.getDay()+7)%7;
  const sat=new Date(s);sat.setDate(s.getDate()+toSat);
  const fri=new Date(sat);fri.setDate(sat.getDate()-1);
  const sun=new Date(sat);sun.setDate(sat.getDate()+1);
  setDates([fri,sat,sun].map(ymd).filter(d=>ALL_DATES.includes(d)));
});
document.getElementById("btnWeek").addEventListener("click",()=>{
  const start=nextDateOnOrAfter(TODAY)||ALL_DATES[0];
  const s=parseYMD(start), end=new Date(s);end.setDate(s.getDate()+6);
  setDates(ALL_DATES.filter(d=>d>=ymd(s)&&d<=ymd(end)));
});
document.getElementById("btnAll").addEventListener("click",()=>setDates(ALL_DATES));
document.getElementById("btnClear").addEventListener("click",()=>setDates([]));

/* ---------- filters ---------- */
document.querySelectorAll(".seg button").forEach(b=>{
  b.addEventListener("click",()=>{
    state.sport=b.dataset.sport;
    document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
    render();
  });
});
document.querySelectorAll(".viewswitch button").forEach(b=>{
  b.addEventListener("click",()=>{
    state.view=b.dataset.view;
    document.querySelectorAll(".viewswitch button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
    render();
  });
});
document.getElementById("fDiv").addEventListener("change",e=>{state.div=e.target.value;render();});
document.getElementById("fField").addEventListener("change",e=>{state.field=e.target.value;render();});
let qT;
document.getElementById("fSearch").addEventListener("input",e=>{
  clearTimeout(qT);
  qT=setTimeout(()=>{state.q=e.target.value.trim().toLowerCase();render();},180);
});

/* ---------- filtering ---------- */
function match(g){
  if(state.dates.size && !state.dates.has(g.d)) return false;
  if(state.sport && g.sp!==state.sport) return false;
  if(state.div && g.dv!==state.div) return false;
  if(state.field && g.cx!==state.field) return false;
  if(state.q){
    const hay=[g.h,g.a,g.dv,g.cx,g.sd,g.r1,g.r2,g.tt,g.tc,g.hc].join(" ").toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}

/* ---------- render ---------- */
function render(){
  const board=document.getElementById("board");
  const sum=document.getElementById("summary");

  if(state.dates.size===0){
    sum.hidden=true;
    board.innerHTML='<div class="empty"><h3>Pick a day to see the schedule</h3>'+
      '<p>Tap a date above, or start with one of the shortcuts.</p>'+
      '<button class="btn" onclick="document.getElementById(\'btnToday\').click()">Show today</button></div>';
    document.getElementById("foot").textContent="";
    return;
  }

  const list=GAMES.filter(match);
  if(!list.length){
    sum.hidden=true;
    board.innerHTML='<div class="empty"><h3>No games match</h3>'+
      '<p>Try clearing a filter or adding another date.</p>'+
      '<button class="btn ghost" id="resetF">Reset filters</button></div>';
    document.getElementById("resetF").addEventListener("click",()=>{
      state.sport="";state.div="";state.field="";state.q="";
      document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.sport===""?"true":"false"));
      document.getElementById("fDiv").value="";
      document.getElementById("fField").value="";
      document.getElementById("fSearch").value="";
      render();
    });
    document.getElementById("foot").textContent="";
    return;
  }

  /* summary */
  sum.hidden=false;
  document.getElementById("sGames").textContent=list.length;
  document.getElementById("sTackle").textContent=list.filter(g=>g.sp==="T").length;
  document.getElementById("sFlag").textContent=list.filter(g=>g.sp!=="T").length;
  document.getElementById("sFields").textContent=new Set(list.map(g=>fieldLabel(g))).size;
  const firstT=list.map(g=>g.t).sort()[0];
  const f12=fmt12(firstT);
  document.getElementById("sFirst").textContent=f12.hh+" "+f12.ampm;

  if(state.view==="timeline"){ renderTimeline(list); return; }

  /* group by date then time */
  const byDate={};
  list.forEach(g=>{(byDate[g.d]=byDate[g.d]||[]).push(g);});
  const now=new Date(), nowYMD=ymd(now), nowMin=now.getHours()*60+now.getMinutes();

  let html="";
  Object.keys(byDate).sort().forEach(d=>{
    const games=byDate[d];
    const dt=parseYMD(d);
    const dow=DOWFULL[games[0].w]||games[0].w;
    const isToday=d===nowYMD;
    html+='<div class="dayhead"><h2>'+(isToday?"Today · ":"")+esc(dow)+", "+MON[dt.getMonth()]+" "+dt.getDate()+'</h2>'+
          '<span class="meta">'+games.length+' game'+(games.length===1?"":"s")+' · '+
          new Set(games.map(fieldLabel)).size+' fields</span></div>';

    const byTime={};
    games.forEach(g=>{(byTime[g.t]=byTime[g.t]||[]).push(g);});
    const times=Object.keys(byTime).sort();

    /* find the next upcoming slot today */
    let nextSlot=null;
    if(isToday) nextSlot=times.find(t=>minutes(t)>nowMin);

    times.forEach(t=>{
      const slotGames=byTime[t].sort((a,b)=>
        fieldLabel(a).localeCompare(fieldLabel(b)) || a.h.localeCompare(b.h));
      const endT=slotGames[0].te;
      const live=isToday && nowMin>=minutes(t) && nowMin<minutes(endT);
      const past=isToday ? nowMin>=minutes(endT) : d<nowYMD;
      const {hh,ampm}=fmt12(t);
      html+='<section class="slot'+(live?" live":"")+'">'+
        '<div class="slot-time"><span class="hh">'+hh+'</span><span class="ampm">'+ampm+'</span>'+
        '<div class="ct">'+slotGames.length+' game'+(slotGames.length===1?"":"s")+'</div>'+
        (live?'<span class="badge-live">Now playing</span>':"")+
        (!live && t===nextSlot?'<span class="badge-next">Up next</span>':"")+
        '</div><div class="cards">';
      slotGames.forEach(g=>{html+=card(g,past);});
      html+='</div></section>';
    });
  });

  board.innerHTML=html;
  const dayCount=Object.keys(byDate).length;
  document.getElementById("foot").textContent=
    "Showing "+list.length+" game"+(list.length===1?"":"s")+" across "+dayCount+" day"+(dayCount===1?"":"s")+
    ". Tower duty is listed for tackle games; officials are listed for girls flag.";
}

/* ---------- timeline view ---------- */
function renderTimeline(list){
  const board=document.getElementById("board");
  const now=new Date(), nowYMD=ymd(now), nowMin=now.getHours()*60+now.getMinutes();

  const byDate={};
  list.forEach(g=>{(byDate[g.d]=byDate[g.d]||[]).push(g);});

  let html='<div class="legend">'+
    '<span><i style="background:var(--sp-t)"></i>Tackle</span>'+
    '<span><i style="background:var(--sp-gf)"></i>Girls Flag</span>'+
    '<span><i style="background:var(--sp-kf)"></i>K–1 Flag</span>'+
  '</div>';

  Object.keys(byDate).sort().forEach(d=>{
    const games=byDate[d];
    const dt=parseYMD(d);
    const dow=DOWFULL[games[0].w]||games[0].w;
    const isToday=d===nowYMD;

    html+='<div class="dayhead"><h2>'+(isToday?"Today · ":"")+esc(dow)+", "+MON[dt.getMonth()]+" "+dt.getDate()+'</h2>'+
          '<span class="meta">'+games.length+' game'+(games.length===1?"":"s")+' · '+
          new Set(games.map(fieldLabel)).size+' fields</span></div>';

    /* Day window, snapped out to whole hours with a little breathing room. */
    let lo=Math.min(...games.map(g=>minutes(g.t)));
    let hi=Math.max(...games.map(g=>minutes(g.te)));
    if(hi<=lo) hi=lo+60;
    lo=Math.floor(lo/60)*60; hi=Math.ceil(hi/60)*60;
    const span=hi-lo;
    const pct=m=>((m-lo)/span)*100;

    /* one lane per field, sorted so complexes group together */
    const lanes=[...new Set(games.map(fieldLabel))].sort();

    /* hour ticks */
    let axis='', grid='';
    for(let m=lo;m<=hi;m+=30){
      const isHour=m%60===0;
      grid+='<i class="'+(isHour?"hour":"")+'" style="left:'+pct(m)+'%"></i>';
      if(isHour){
        const f=fmt12(String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"));
        axis+='<span style="left:'+pct(m)+'%">'+f.hh+(span<=240?" "+f.ampm:"")+'</span>';
      }
    }
    const nowMark=(isToday && nowMin>=lo && nowMin<=hi)
      ? '<div class="tl-now" style="left:'+pct(nowMin)+'%"></div>' : '';

    html+='<div class="tl"><div class="tl-inner">';
    html+='<div class="tl-axis">'+axis+'</div>';

    lanes.forEach(lane=>{
      const inLane=games.filter(g=>fieldLabel(g)===lane)
                        .sort((a,b)=>minutes(a.t)-minutes(b.t));
      let bars='';
      inLane.forEach(g=>{
        const s0=minutes(g.t), e0=Math.max(minutes(g.te), s0+15);
        const left=pct(s0), width=Math.max(pct(e0)-pct(s0), 2.2);
        const label=g.h+" v "+g.a;
        const time=fmt12(g.t);
        /* Show both teams when the bar is wide enough, else home only, so a
           short bar never clips mid-word. Track is ~556px at the 660px min. */
        const barPx=(width/100)*(660-104);
        const inner = (label.length*6.0+14) <= barPx
          ? '<b>'+esc(g.h)+'</b>&nbsp;v&nbsp;'+esc(g.a)
          : '<b>'+esc(g.h)+'</b>';
        bars+='<div class="tl-bar sp-'+g.sp+(g.tent?" tent":"")+'" '+
              'style="left:'+left+'%;width:'+width+'%" '+
              'title="'+esc(time.hh+" "+time.ampm+" · "+g.dv+" · "+label+" · "+lane)+'">'+
              inner+'</div>';
      });
      html+='<div class="tl-row"><div class="tl-lane">'+esc(lane)+'</div>'+
            '<div class="tl-track"><div class="tl-grid">'+grid+'</div>'+nowMark+bars+'</div></div>';
    });

    html+='</div></div>';
  });

  board.innerHTML=html;
  const dayCount=Object.keys(byDate).length;
  document.getElementById("foot").textContent=
    "Timeline · "+list.length+" game"+(list.length===1?"":"s")+" across "+dayCount+
    " day"+(dayCount===1?"":"s")+". Each bar spans the scheduled start and end time.";
}

function card(g,past){
  const hc=TEAMS[g.h]||["8B0000","CCCCCC"], ac=TEAMS[g.a]||["8B0000","CCCCCC"];


  let crew="";
  if(g.sp==="T"){
    if(g.tt){
      crew+='<div class="tower"><b>Tower</b><span class="val">'+esc(g.tt)+
            (g.tc?" · Coach "+esc(g.tc):' · <span class="gap">coach TBD</span>')+'</span></div>';
    }
  }else{
    const refs=[g.r1,g.r2].filter(Boolean);
    if(refs.length) crew+='<div><b>Officials</b><span class="val">'+esc(refs.join(", "))+'</span></div>';
    else if(g.dv.indexOf("Girls")>-1) crew+='<div><b>Officials</b><span class="val gap">Not yet assigned</span></div>';
    if(g.rn) crew+='<div><b>Note</b><span class="val">'+esc(g.rn)+'</span></div>';
  }
  const e12=fmt12(g.te);
  let scoreHtml="";
  if(g.fs){
    const hw=g.fs[0]>g.fs[1], aw=g.fs[1]>g.fs[0];
    scoreHtml='<div class="score"><span class="'+(hw?"w":"")+'">'+g.fs[0]+'</span>'+
              '<span class="sep">FINAL</span><span class="'+(aw?"w":"")+'">'+g.fs[1]+'</span></div>';
  }
  return '<article class="game'+(past?" past":"")+'">'+
    '<div class="spine"><i style="background:#'+hc[0]+'"></i><i style="background:#'+ac[0]+'"></i></div>'+
    '<div class="game-top">'+
      '<span class="tag sport-'+g.sp+'">'+(SPORT_LABEL[g.sp]||"Game")+'</span>'+
      '<span class="tag div">'+esc(g.dv)+'</span>'+
      (g.tent?'<span class="tag tent">TBC</span>':'')+
      '<span class="field">'+esc(fieldLabel(g))+'</span>'+
    '</div>'+
    '<p class="matchup">'+esc(g.h)+'<span class="vs">vs</span>'+esc(g.a)+'</p>'+
    (scoreHtml||'<div class="kick">Ends '+e12.hh+' '+e12.ampm+'</div>')+
    (crew?'<div class="crew">'+crew+'</div>':"")+
  '</article>';
}

/* ---------- clock ---------- */
function tickClock(){
  const d=new Date();
  document.getElementById("clock").textContent=
    d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})+" · "+
    d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
tickClock(); setInterval(()=>{tickClock();if(state.dates.has(TODAY))render();},60000);

/* Set this to your deployed feed Worker to go live.
   Leave "" to run on the schedule embedded in this file. */
const FEED_URL = "";  // "https://cgbfl-schedule-feed.brianbevis.workers.dev/schedule"
const FEED_POLL_MS = 300000; /* 5 min. SportsEngine itself only moves every ~30. */

let feedState = {loaded:false, at:null, count:0, mode:"embedded"};

function setFeedBar(mode, msg){
  const bar=document.getElementById("feedbar");
  if(!FEED_URL){bar.hidden=true;return;}
  bar.hidden=false;
  bar.className="feedbar "+mode;
  document.getElementById("feedMsg").textContent=msg;
}

function agoText(d){
  const s=Math.round((Date.now()-d)/1000);
  if(s<60) return "just now";
  const m=Math.round(s/60);
  if(m<60) return m+" min ago";
  const h=Math.round(m/60);
  return h+" hr ago";
}

function applyFeed(payload){
  if(!payload || !Array.isArray(payload.games) || !payload.games.length) throw new Error("Feed returned no games");
  GAMES.length=0;
  payload.games.filter(g=>g.h&&g.a).forEach(g=>GAMES.push(g));
  if(payload.teams) Object.assign(TEAMS, payload.teams);
  ALL_DATES.length=0;
  [...new Set(GAMES.map(g=>g.d))].sort().forEach(d=>ALL_DATES.push(d));
  feedState={loaded:true, at:Date.now(), count:GAMES.length, mode:"live"};
  const keep=new Set([...state.dates].filter(d=>ALL_DATES.includes(d)));
  state.dates=keep;
  buildStrip();
  if(state.dates.size===0) document.getElementById("btnToday").click();
  else render();
}

async function loadFeed(manual){
  if(!FEED_URL) return;
  if(manual) setFeedBar("", "Checking SportsEngine…");
  try{
    const url=FEED_URL+(FEED_URL.indexOf("?")>-1?"&":"?")+(manual?"fresh=1&":"")+"_="+Date.now();
    const ctrl=new AbortController();
    const to=setTimeout(()=>ctrl.abort(), 12000);
    const res=await fetch(url,{signal:ctrl.signal,cache:"no-store"});
    clearTimeout(to);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const payload=await res.json();
    applyFeed(payload);
    const badFeeds=(payload.feeds||[]).filter(f=>!f.ok);
    if(badFeeds.length){
      setFeedBar("stale","Live from SportsEngine, updated "+agoText(feedState.at)+
        ". "+badFeeds.length+" feed"+(badFeeds.length===1?"":"s")+" unavailable, showing last known games.");
    }else{
      setFeedBar("live","Live from SportsEngine · "+GAMES.length+" games · updated "+agoText(feedState.at));
    }
  }catch(e){
    if(feedState.loaded){
      setFeedBar("stale","Could not reach SportsEngine. Showing schedule from "+agoText(feedState.at)+".");
    }else{
      setFeedBar("offline","Could not reach SportsEngine. Showing the schedule saved in this page.");
    }
  }
}

document.getElementById("btnRefresh").addEventListener("click",()=>loadFeed(true));
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden && feedState.loaded && Date.now()-feedState.at>FEED_POLL_MS) loadFeed(false);
});

/* ---------- boot ---------- */
buildStrip();
document.getElementById("btnToday").click();
if(FEED_URL){
  loadFeed(false);
  setInterval(()=>loadFeed(false), FEED_POLL_MS);
  setInterval(()=>{
    if(feedState.loaded){
      const bar=document.getElementById("feedbar");
      if(bar && !bar.classList.contains("offline")){
        document.getElementById("feedMsg").textContent =
          (bar.classList.contains("stale")
            ? "Could not reach SportsEngine. Showing schedule from "
            : "Live from SportsEngine · "+GAMES.length+" games · updated ")+agoText(feedState.at);
      }
    }
  }, 60000);
}
</script>
